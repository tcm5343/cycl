name: e2e

# Runs e2e/tests against the long-lived infra in AWS (built by bootstrap-e2e.yml), testing a wheel built
# earlier in the calling workflow run. Installing the wheel directly means cycl's dependencies only ever
# come from PyPI.
on:
  workflow_call:
    inputs:
      artifact-id:
        description: 'ID of an artifact from the calling run whose contents (a dist/ directory) include exactly one wheel'
        type: string
        required: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: aws
    concurrency:
      group: aws-e2e  # shared with bootstrap-e2e.yml, which changes the infra these tests read
      cancel-in-progress: false
    permissions:
      id-token: write  # configure-aws-credentials
      contents: read   # checkout
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false

      - name: install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version-file: pyproject.toml

      - name: Download built distribution
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          artifact-ids: ${{ inputs.artifact-id }}
          path: dist/

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6.3.0
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::929185124050:role/e2e-testing-role
          role-session-name: e2e-testing-role

      - name: run e2e
        run: |
          shopt -s nullglob
          wheels=(dist/*.whl)
          if (( ${#wheels[@]} != 1 )); then
            echo "expected exactly one wheel in dist/, found ${#wheels[@]}:"
            ls -l dist/
            exit 1
          fi
          make run-e2e CYCL_SPEC="${wheels[0]}"
