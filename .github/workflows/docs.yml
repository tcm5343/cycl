name: docs

# Publishes the documentation to GitHub Pages. Runs independently of the release so docs-only
# changes can be published without cutting a release, and is reused by main.yml after a release.
on:
  push:
    branches: ['main']
    paths: ['docs/**', '.github/workflows/docs.yml']
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref (e.g. a release tag) to build the docs from'
        type: string
        default: ''

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0  # version is derived from git tags

      - name: install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version-file: pyproject.toml

      - name: Install dependencies
        run: uv sync --group doc --locked

      - name: Sphinx build
        run: uv run sphinx-build docs docs/_build --builder html --fresh-env -W --keep-going

      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b  # v4.0.0
        with:
          path: docs/_build/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4.0.5
