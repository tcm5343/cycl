name: main

on:
  pull_request:  # default types (opened, synchronize, reopened)
    branches: ['main']
  push:
    branches: ['main']  # other branches are covered by pull_request
    paths-ignore: ['docs/**']  # docs-only changes are published by docs.yml, without a release
  workflow_dispatch:

# push only ever fires for main, so `github.event_name == 'push'` means a full release; workflow_dispatch cuts a
# prerelease (Test PyPI only) from the chosen branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # a new push to a pull request supersedes its in-progress run; runs on main queue instead, so a release is never
  # cut off halfway (note GitHub keeps only the newest pending run per group, so back-to-back merges release together)
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit-tests:
    name: ${{ matrix.target }}_${{ matrix.python-version }}_${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: ['ubuntu-latest']
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14', '3.15']
        target: ['test']  # makefile target(s) to run
        include:
          - os: ubuntu-latest
            python-version: '3.10'
            target: validate
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false

      - name: setup python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version-file: pyproject.toml

      - name: make ${{ matrix.target }}
        run: make "${TARGET}"
        env:
          TARGET: ${{ matrix.target }}
          UV_PYTHON: ${{ matrix.python-version }}

  build-docs:
    permissions:
      contents: read
      # docs.yml's deploy job is skipped with build-only, but a called workflow's permissions are capped by the
      # caller's, and GitHub checks that cap before deciding what to skip; the build job itself only gets contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml
    with:
      build-only: true

  create-release:
    needs: [build-docs, unit-tests]
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.new_tag }}
    permissions:
      contents: write  # needed for tag creation
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          fetch-depth: '0'  # fetches tags
          # credentials are kept (unlike the other checkouts): github-tag-action pushes the tag with git

      - name: Bump version and push tag
        id: tag
        uses: anothrNick/github-tag-action@4ed44965e0db8dab2b466a16da04aec3cc312fd8  # 1.75.0
        env:
          DEFAULT_BUMP: patch
          GIT_API_TAGGING: false
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE_SUFFIX: b
          PRERELEASE: ${{ github.event_name != 'push' }}
          WITH_V: true

      - name: Create release from tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.tag.outputs.new_tag }}
        run: |
          gh release create "${tag}" \
              --repo="$GITHUB_REPOSITORY" \
              --title="${tag#v}" \
              --generate-notes

  build-dist:
    # on pull requests: builds the merge commit. on release: builds the tag create-release just pushed, so the
    # version is the release version (it is derived from git tags)
    needs: [unit-tests, create-release]
    # create-release is always skipped on pull requests, so !cancelled() stops that skip from skipping this job;
    # unit-tests is checked explicitly since !cancelled() would otherwise run e2e on code with failing unit tests.
    # e2e assumes an AWS role via OIDC, which fork and Dependabot pull requests can't do
    if: >-
      ${{ !cancelled() && needs.unit-tests.result == 'success' && (
        needs.create-release.result == 'success' ||
        (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
      ) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          fetch-depth: 0  # version is derived from git tags
          ref: ${{ needs.create-release.outputs.tag }}  # empty on pull requests, so the default ref is used
          persist-credentials: false

      - name: install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version-file: pyproject.toml

      - name: Build distribution
        run: uv build

      - name: Upload distribution artifacts
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: ${{ github.event_name == 'pull_request' && 1 || 7 }}

  e2e:
    # tests the exact wheel published to Test PyPI and PyPI; installing it directly (rather than from Test PyPI)
    # keeps cycl's dependencies coming only from PyPI
    needs: [build-dist]
    # without this, the implicit success() check fails on pull requests, because create-release (an ancestor) is skipped
    if: ${{ !cancelled() && needs.build-dist.result == 'success' }}
    permissions:
      id-token: write  # configure-aws-credentials
      contents: read   # checkout
    uses: ./.github/workflows/e2e.yml
    with:
      artifact-id: ${{ needs.build-dist.outputs.artifact-id }}

  deploy-docs:
    needs: [create-release]
    if: ${{ github.event_name == 'push' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml
    with:
      ref: ${{ needs.create-release.outputs.tag }}

  deploy-pypi-test:
    needs: [build-dist]
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    environment:
      name: test
      url: ${{ vars.PYPI_PROJECT_URL }}
    permissions:
      id-token: write   # needed for publishing to PyPI
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          sparse-checkout: pyproject.toml  # setup-uv reads the uv version from it (version-file)
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Download built distribution
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/

      - name: install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version-file: pyproject.toml

      - name: publish
        run: uv publish --publish-url "${PYPI_REPOSITORY_URL}"
        env:
          PYPI_REPOSITORY_URL: ${{ vars.PYPI_REPOSITORY_URL }}

  deploy-pypi-prod:
    needs: [e2e, deploy-pypi-test]
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    environment:
      name: prod
      url: ${{ vars.PYPI_PROJECT_URL }}
    permissions:
      id-token: write   # needed for publishing to PyPI
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          sparse-checkout: pyproject.toml  # setup-uv reads the uv version from it (version-file)
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Download built distribution
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/

      - name: install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version-file: pyproject.toml

      - name: publish
        run: uv publish
