name: main

on:
  pull_request:
    types: ['opened', 'synchronize']
    branches: ['main']
  push:
    branches: ['main']  # other branches are covered by pull_request
    paths-ignore: ['docs/**']  # docs-only changes are published by docs.yml, without a release
  workflow_dispatch:

jobs:
  workflow-setup:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      is_push_to_main: ${{ steps.set-vars.outputs.is_push_to_main }}
    steps:
      - id: set-vars
        run: |
          is_push_to_main='false'
          if [[ "${{ github.ref }}" == "refs/heads/${{ github.event.repository.default_branch }}" && "${{ github.event_name }}" == "push" ]]; then
            is_push_to_main='true'
          fi
          echo "is_push_to_main=${is_push_to_main}" >> $GITHUB_OUTPUT

  unit-tests:
    needs: workflow-setup
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: ['ubuntu-latest']
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14', '3.15']
        target: ['test']  # makefile target(s) to run
        include:
          - os: ubuntu-latest
            python-version: '3.10'
            target: validate
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0

      - name: setup python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version-file: pyproject.toml

      - name: make ${{ matrix.target }}
        run: make "${TARGET}"
        env:
          TARGET: ${{ matrix.target }}
          UV_PYTHON: ${{ matrix.python-version }}

  build-docs:
    needs: workflow-setup
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0

      - name: install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version-file: pyproject.toml

      - name: Install dependencies
        run: uv sync --group doc --locked

      - name: Sphinx build
        run: uv run sphinx-build docs docs/_build --builder html --fresh-env -W --keep-going

  build-pr-dist:
    needs: workflow-setup
    # e2e assumes an AWS role via OIDC, which fork and Dependabot pull requests can't do
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          fetch-depth: 0  # version is derived from git tags

      - name: install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version-file: pyproject.toml

      - name: Build distribution
        run: uv build

      - name: Upload distribution artifacts
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: pr-dist
          path: dist/
          retention-days: 1

  e2e-pr:
    needs: build-pr-dist
    permissions:
      id-token: write  # configure-aws-credentials
      contents: read   # checkout
    uses: ./.github/workflows/e2e.yml
    with:
      artifact-id: ${{ needs.build-pr-dist.outputs.artifact-id }}

  create-release:
    needs: [workflow-setup, build-docs, unit-tests]
    if: ${{ needs.workflow-setup.outputs.is_push_to_main == 'true'|| github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.new_tag }}
    permissions:
      contents: write  # needed for tag creation
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          fetch-depth: '0'  # fetches tags

      - name: Bump version and push tag
        id: tag
        uses: anothrNick/github-tag-action@4ed44965e0db8dab2b466a16da04aec3cc312fd8  # 1.75.0
        env:
          DEFAULT_BUMP: patch
          GIT_API_TAGGING: false
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE_SUFFIX: b
          PRERELEASE: ${{ needs.workflow-setup.outputs.is_push_to_main == 'false' }}
          WITH_V: true

      - name: Create release from tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.tag.outputs.new_tag }}
        run: |
          gh release create "${tag}" \
              --repo="$GITHUB_REPOSITORY" \
              --title="${tag#v}" \
              --generate-notes

  build-pypi-dist:
    needs: [create-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          fetch-depth: 0

      - name: Checkout the tagged version
        run: git checkout refs/tags/${{ needs.create-release.outputs.tag }}

      - name: install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version-file: pyproject.toml

      - name: Build distribution
        run: uv build

      - name: Upload distribution artifacts
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: pypi-artifact
          path: dist/
          retention-days: 7

  deploy-docs:
    needs: [workflow-setup, create-release]
    if: ${{ needs.workflow-setup.outputs.is_push_to_main == 'true' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml
    with:
      ref: ${{ needs.create-release.outputs.tag }}

  deploy-pypi-test:
    needs: [build-pypi-dist, workflow-setup]
    if: ${{ needs.workflow-setup.outputs.is_push_to_main == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    environment:
      name: test
      url: ${{ vars.PYPI_PROJECT_URL }}
    permissions:
      id-token: write   # needed for publishing to PyPI
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          sparse-checkout: pyproject.toml  # setup-uv reads the uv version from it (version-file)
          sparse-checkout-cone-mode: false

      - name: Download built distribution
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: pypi-artifact
          path: dist/

      - name: install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version-file: pyproject.toml

      - name: publish
        run: uv publish --publish-url ${{ vars.PYPI_REPOSITORY_URL }}

  e2e-release:
    # tests the exact wheel published to Test PyPI and PyPI; installing it directly (rather than from Test PyPI)
    # keeps cycl's dependencies coming only from PyPI
    needs: [build-pypi-dist]
    permissions:
      id-token: write  # configure-aws-credentials
      contents: read   # checkout
    uses: ./.github/workflows/e2e.yml
    with:
      artifact-id: ${{ needs.build-pypi-dist.outputs.artifact-id }}

  deploy-pypi-prod:
    needs: [e2e-release, deploy-pypi-test, workflow-setup]
    if: ${{ needs.workflow-setup.outputs.is_push_to_main == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: prod
      url: ${{ vars.PYPI_PROJECT_URL }}
    permissions:
      id-token: write   # needed for publishing to PyPI
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          sparse-checkout: pyproject.toml  # setup-uv reads the uv version from it (version-file)
          sparse-checkout-cone-mode: false

      - name: Download built distribution
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: pypi-artifact
          path: dist/

      - name: install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version-file: pyproject.toml

      - name: publish
        run: uv publish
