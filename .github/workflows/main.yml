name: main

on:
  pull_request:
    types: ['opened', 'synchronize']
    branches: ['main']
  push:
    branches: ['main']  # other branches are covered by pull_request
    paths-ignore: ['docs/**']  # docs-only changes are published by docs.yml, without a release
  workflow_dispatch:

jobs:
  workflow-vars:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      is_push_to_main: ${{ steps.set-vars.outputs.is_push_to_main }}
    steps:
      - id: set-vars
        run: |
          is_push_to_main='false'
          if [[ "${{ github.ref }}" == "refs/heads/${{ github.event.repository.default_branch }}" && "${{ github.event_name }}" == "push" ]]; then
            is_push_to_main='true'
          fi
          echo "is_push_to_main=${is_push_to_main}" >> $GITHUB_OUTPUT

  code-quality:
    needs: workflow-vars
    permissions:
      contents: read
    runs-on: 'ubuntu-latest'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version-file: .python-version

      - name: install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version-file: pyproject.toml

      - name: validate
        run: make validate

  unit-tests:
    needs: workflow-vars
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: ['ubuntu-latest']
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14', '3.15']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0

      - name: setup python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version-file: pyproject.toml

      - name: run tests
        run: make test
        env:
          UV_PYTHON: ${{ matrix.python-version }}

  build-docs:
    needs: workflow-vars
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0

      - name: install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version-file: pyproject.toml

      - name: Install dependencies
        run: uv sync --group doc --locked

      - name: Sphinx build
        run: uv run sphinx-build docs docs/_build --builder html --fresh-env -W --keep-going

  create-release:
    needs: [workflow-vars, build-docs, unit-tests, code-quality]
    if: ${{ needs.workflow-vars.outputs.is_push_to_main == 'true'|| github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.new_tag }}
    permissions:
      contents: write  # needed for tag creation
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          fetch-depth: '0'  # fetches tags

      - name: Bump version and push tag
        id: tag
        uses: anothrNick/github-tag-action@4ed44965e0db8dab2b466a16da04aec3cc312fd8  # 1.75.0
        env:
          DEFAULT_BUMP: patch
          GIT_API_TAGGING: false
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE_SUFFIX: b
          PRERELEASE: ${{ needs.workflow-vars.outputs.is_push_to_main == 'false' }}
          WITH_V: true

      - name: Create release from tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.tag.outputs.new_tag }}
        run: |
          gh release create "${tag}" \
              --repo="$GITHUB_REPOSITORY" \
              --title="${tag#v}" \
              --generate-notes

  build-pypi-dist:
    needs: [create-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          fetch-depth: 0

      - name: Checkout the tagged version
        run: git checkout refs/tags/${{ needs.create-release.outputs.tag }}

      - name: install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version-file: pyproject.toml

      - name: Build distribution
        run: uv build

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        with:
          name: pypi-artifact
          path: dist/
          retention-days: 7

  deploy-docs:
    needs: [workflow-vars, create-release]
    if: ${{ needs.workflow-vars.outputs.is_push_to_main == 'true' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml
    with:
      ref: ${{ needs.create-release.outputs.tag }}

  deploy-pypi-test:
    needs: [build-pypi-dist, workflow-vars]
    if: ${{ needs.workflow-vars.outputs.is_push_to_main == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    environment:
      name: test
      url: ${{ vars.PYPI_PROJECT_URL }}
    permissions:
      id-token: write   # needed for publishing to PyPI
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          sparse-checkout: pyproject.toml  # setup-uv reads the uv version from it (version-file)
          sparse-checkout-cone-mode: false

      - name: Download built distribution
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        with:
          name: pypi-artifact
          path: dist/

      - name: install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version-file: pyproject.toml

      - name: publish
        run: uv publish --publish-url ${{ vars.PYPI_REPOSITORY_URL }}

  e2e-pypi-test:
    needs: [create-release, deploy-pypi-test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: aws
    permissions:
      id-token: write # This is required for requesting the JWT
      contents: read  # This is required for actions/checkout
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version-file: .python-version

      - name: install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version-file: pyproject.toml

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6.3.0
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::929185124050:role/e2e-testing-role
          role-session-name: e2e-testing-role

      - name: install cycl from pypi test
        shell: bash
        env:
          TEST_VERSION: ${{ needs.create-release.outputs.tag }}
        run: |
          uv venv  # .venv for the Test PyPI install below and `make run-e2e`

          PACKAGE="cycl==${TEST_VERSION#v}"
          INDEX_URL="https://test.pypi.org/simple/"
          EXTRA_INDEX_URL="https://pypi.org/simple"
          MAX_ATTEMPTS=12
          SLEEP=15

          for i in $(seq 1 $MAX_ATTEMPTS); do
            if uv pip install \
                --index-url "$INDEX_URL" \
                --extra-index-url "$EXTRA_INDEX_URL" \
                --index-strategy unsafe-best-match \
                --no-cache-dir \
                "$PACKAGE"; then
              echo "Package installed successfully!"
              break
            fi
            echo "Attempt $i/$MAX_ATTEMPTS failed. Retrying in $SLEEP seconds..."
            sleep $SLEEP
          done

          if ! uv pip show cycl >/dev/null 2>&1; then
            echo "Failed to install $PACKAGE from Test PyPI after $((MAX_ATTEMPTS * SLEEP)) seconds."
            exit 1
          fi

      - name: run e2e
        run: make run-e2e

  deploy-pypi-prod:
    needs: [e2e-pypi-test, workflow-vars]
    if: ${{ needs.workflow-vars.outputs.is_push_to_main == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: prod
      url: ${{ vars.PYPI_PROJECT_URL }}
    permissions:
      id-token: write   # needed for publishing to PyPI
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          sparse-checkout: pyproject.toml  # setup-uv reads the uv version from it (version-file)
          sparse-checkout-cone-mode: false

      - name: Download built distribution
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        with:
          name: pypi-artifact
          path: dist/

      - name: install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version-file: pyproject.toml

      - name: publish
        run: uv publish
