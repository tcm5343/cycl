[build-system]
requires = [
    'setuptools>=70',
    'wheel',
    'setuptools-git-versioning>=2.1',
]
build-backend = 'setuptools.build_meta'

[project]
name = 'cycl'
requires-python = '>=3.9'
description = 'cycl is a CLI and Python SDK to help identify cross-stack import/export circular dependencies, for a given AWS account and region.'
readme = 'README.md'
license = {text = "MIT"}
keywords = ['aws', 'cdk', 'cycle', 'circular', 'dependency', 'infrastructure', 'boto3', 'cloud']
classifiers = [
    'Intended Audience :: Developers',
    'Natural Language :: English',
    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
    'Programming Language :: Python :: 3.9',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python',
    'Topic :: Software Development',
]
dependencies = [
    'boto3>=1.26',
    'networkx~=3.0',
]
dynamic = ['version']

[tool.setuptools-git-versioning]
enabled = true

[dependency-groups]
test = [
    'pytest>=7.4,<8',
    'pytest-cov>=7.0',
    'pytest-sugar>=1.1',
    'pytest-subtests>=0.15',
    'pytest-xdist>=3.8',
]
validation = [
    'boto3-stubs[essential]>=1.40',
    'mypy>=1.18',
    'ruff>=0.14',
    'types-networkx>=3.4',
]
doc = [
    'myst-parser>=3.0,<4',
    'sphinx>=7.4,<8',
    'sphinx-argparse>=0.4',
    'sphinx-autobuild>=2024.10',
    'sphinx_rtd_theme>=3.0',
]
dist = [
    'build>=1.3',
    'twine>=6.1',  # not used in pipeline
]
e2e = [
    'pytest>=7.4,<8',
    'aws-cdk-lib==2.172.0',  # keep in sync with e2e/infra
    'constructs>=10.0.0,<11.0.0',
]
dev = [
    {include-group = 'test'},
    {include-group = 'validation'},
    {include-group = 'doc'},
    {include-group = 'dist'},
    {include-group = 'e2e'},
]

[project.urls]
Repository = 'http://github.com/tcm5343/cycl'
Documentation = 'https://tcm5343.github.io/cycl/index.html'

[project.scripts]
cycl = 'cycl.cli:app'

[tool.ruff]
line-length = 125

[tool.ruff.lint]
select = ['ALL']
ignore = [
    'COM',      # flake8-commas
    'D100',
    'D101',
    'D102',
    'D103',
    'D104',
    'D105',
    'D106',
    'D107',
    'ERA001',   # commented-out-code
    'FIX002',   # line-contains-todo
    'Q000',     # bad-quotes-inline-string
    'Q003',     # avoidable-escaped-quote
    'T201',     # print
    'TD',       # flake8-todos
]

[tool.ruff.lint.per-file-ignores]
'**/tests/**' = [
    'ANN',      # flake8-annotations
    'PLR2004',  # magic-value-comparison
    'S101',     # assert
]
'docs/**' = [
    'INP001',   # implicit-namespace-package
    'A001',     # builtin-variable-shadowing
]
'e2e/tests/**' = [
    'S603',     # subprocess-without-shell-equals-true - needed to invoke cycl CLI
]
'e2e/infra/stage/**' = [
    'A002',     # builtin-argument-shadowing - id is the keyword argument
]
'__init__.py' = [
    'F401',     # unused-import
]

[tool.ruff.format]
quote-style = 'single'
indent-style = 'space'
docstring-code-format = true

[tool.ruff.lint.pydocstyle]
convention = 'google'

[tool.coverage.run]
branch = true
source = ['./src']

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
skip_empty = true
exclude_lines = [
    'if TYPE_CHECKING:',
]
omit = [
    '__*__.py',
]

[tool.pytest.ini_options]
log_cli_level = 'INFO'
addopts = ['--import-mode=importlib']

[tool.uv]
default-groups = []
